<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterk Rygg Webinar</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa0ab;
    --accent: #e0457b;
    --host: #2b2034;
    --live: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .live {
    background: var(--live); color: #fff; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; padding: 3px 8px; border-radius: 4px;
  }
  .viewers { margin-left: auto; color: var(--muted); font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    padding: 16px 20px;
    height: calc(100vh - 53px);
  }
  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .video {
    position: relative; width: 100%;
    aspect-ratio: 16 / 9; max-height: calc(100vh - 140px);
    background: #000; border-radius: 10px; overflow: hidden;
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.72); z-index: 2; text-align: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0; color: var(--muted); }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 12px 26px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    color: var(--muted); font-size: 13px;
  }
  .controls button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--muted); }
  .clock { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }

  .chat {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .chat-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-weight: 600; display: flex; justify-content: space-between;
  }
  .chat-head span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .messages { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
  .msg {
    display: flex; gap: 10px; padding: 8px; border-radius: 8px;
    animation: in .25s ease-out;
  }
  .msg.host { background: var(--host); }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
  }
  .body { min-width: 0; }
  .meta { font-size: 13px; }
  .name { font-weight: 600; }
  .badge {
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
  }
  .time { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .text { overflow-wrap: anywhere; white-space: pre-wrap; }
  .text a { color: #ff8db5; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .composer input {
    flex: 1; min-width: 0; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0 16px; font-weight: 600; cursor: pointer;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; height: auto; padding: 12px 16px; }
    .video { max-height: none; }
    .chat { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <span class="live">LIVE</span>
  <h1>Sterk Rygg – Webinar med Maiken Lund</h1>
  <span class="viewers" id="viewers"></span>
</header>

<main class="layout">
  <section class="stage">
    <div class="video">
      <iframe id="player"
        src="https://www.veed.io/embed/aa0f1f3c-edac-4e9b-86a2-bdfb021e0478?watermark=1&color=&sharing=1&title=1"
        title="Sterk Rygg webinar" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div class="overlay" id="overlay">
        <button class="btn" id="join">▶ Bli med på webinaret</button>
        <p>Trykk, og start deretter videoen</p>
      </div>
    </div>
    <div class="controls">
      <span>Chat-tid: <span class="clock" id="clock">0:00:00</span></span>
      <button id="toggle">⏸ Pause chat</button>
      <button data-shift="-10">−10s</button>
      <button data-shift="10">+10s</button>
      <button id="restart">↺ Start på nytt</button>
      <span class="spacer"></span>
      <span>Pause chatten når du pauser videoen, så holder de seg synkronisert.</span>
    </div>
  </section>

  <aside class="chat">
    <div class="chat-head">Chat <span id="count">0 meldinger</span></div>
    <div class="messages" id="messages">
      <div class="empty" id="empty">Chatten starter når webinaret begynner.</div>
    </div>
    <form class="composer" id="composer">
      <input id="input" placeholder="Skriv en melding…" autocomplete="off" maxlength="500">
      <button type="submit">Send</button>
    </form>
  </aside>
</main>

<script>
const CHAT = __CHAT__;
const HOST = "Maiken Lund";
const COLORS = ["#e0457b","#3b82f6","#10b981","#f59e0b","#8b5cf6","#ef4444","#14b8a6","#ec4899","#6366f1","#84cc16"];

const $ = id => document.getElementById(id);
const list = $("messages");
let elapsed = 0;          // seconds of webinar time already played
let startedAt = null;     // performance.now() when clock last resumed, null while paused
let shown = 0;            // number of CHAT entries rendered
let mine = [];            // viewer's own messages: {t, m}

function now() { return elapsed + (startedAt === null ? 0 : (performance.now() - startedAt) / 1000); }
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 3600) + ":" + String(Math.floor(s / 60) % 60).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function color(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function initials(name) { return name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }

function render(entry, self) {
  const host = entry.n === HOST || entry.n === "Maiken";
  const el = document.createElement("div");
  el.className = "msg" + (host ? " host" : "");
  el.innerHTML = `
    <div class="avatar" style="background:${self ? "#4b5563" : color(entry.n)}">${esc(initials(entry.n))}</div>
    <div class="body">
      <div class="meta"><span class="name">${esc(entry.n)}</span>${host ? '<span class="badge">VERT</span>' : ""}<span class="time">${fmt(entry.t)}</span></div>
      <div class="text">${linkify(entry.m)}</div>
    </div>`;
  return el;
}

function rebuild() {
  // Re-render from scratch (after seeking backwards / restarting).
  list.innerHTML = "";
  shown = 0;
  const t = now();
  const items = CHAT.filter(c => c.t <= t).map(c => [c, false])
    .concat(mine.filter(c => c.t <= t).map(c => [c, true]))
    .sort((a, b) => a[0].t - b[0].t);
  shown = CHAT.filter(c => c.t <= t).length;
  if (!items.length) list.innerHTML = '<div class="empty">Chatten starter når webinaret begynner.</div>';
  items.forEach(([c, self]) => list.appendChild(render(c, self)));
  list.scrollTop = list.scrollHeight;
  updateCount();
}

function updateCount() {
  const n = list.querySelectorAll(".msg").length;
  $("count").textContent = n + (n === 1 ? " melding" : " meldinger");
}

function tick() {
  const t = now();
  $("clock").textContent = fmt(t);
  if (shown < CHAT.length && CHAT[shown].t <= t) {
    const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    const empty = list.querySelector(".empty"); if (empty) empty.remove();
    while (shown < CHAT.length && CHAT[shown].t <= t) list.appendChild(render(CHAT[shown++], false));
    if (nearBottom) list.scrollTop = list.scrollHeight;
    updateCount();
  }
  // Viewer count roughly follows chat activity, like a live room.
  const active = new Set(CHAT.slice(0, shown).map(c => c.n)).size;
  $("viewers").textContent = startedAt !== null || elapsed > 0 ? `👥 ${Math.max(12, active + 18)} ser på` : "";
}

function play()  { if (startedAt === null) { startedAt = performance.now(); $("toggle").textContent = "⏸ Pause chat"; } }
function pause() { if (startedAt !== null) { elapsed = now(); startedAt = null; $("toggle").textContent = "▶ Fortsett chat"; } }

$("join").onclick = () => { $("overlay").hidden = true; play(); };
$("toggle").onclick = () => (startedAt === null ? play() : pause());
$("restart").onclick = () => { elapsed = 0; if (startedAt !== null) startedAt = performance.now(); rebuild(); };
document.querySelectorAll("[data-shift]").forEach(b => b.onclick = () => {
  const d = +b.dataset.shift;
  elapsed = Math.max(0, now() + d);
  if (startedAt !== null) startedAt = performance.now();
  if (d < 0) rebuild(); else tick();
});

$("composer").onsubmit = e => {
  e.preventDefault();
  const m = $("input").value.trim();
  if (!m) return;
  const entry = { t: now(), n: "Deg", m };
  mine.push(entry);
  const empty = list.querySelector(".empty"); if (empty) empty.remove();
  list.appendChild(render(entry, true));
  list.scrollTop = list.scrollHeight;
  $("input").value = "";
  updateCount();
};

setInterval(tick, 250);
tick();
</script>
</body>
</html>
